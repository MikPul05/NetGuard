x-netguard: &netguard
  build: .
  image: netguard:latest
  # Run as your host user so result files in ./data are not owned by root.
  # On Linux: export UID GID (or put them in .env) if yours differ from 1000.
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - ./data:/data
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  # --- Message broker (Kafka in KRaft mode, no ZooKeeper) -------------------
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9094:9094"   # access from the host (WSL/Windows): localhost:9094
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Creates the topics once Kafka is up, then exits.
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in flows detections; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  # Web UI to browse topics and messages: http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: netguard
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # --- Streaming detector: topic "flows" -> engine -> topic "detections" ----
  detector:
    <<: *netguard
    command: ["stream-detect", "--out", "stream/detections.jsonl"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- CLI tool (one-off commands) -----------------------------------------
  # Examples:
  #   docker compose run --rm netguard pipeline capture.pcap   (offline, files only)
  #   docker compose run --rm netguard stream capture.pcap     (PCAP -> Kafka)
  netguard:
    <<: *netguard
    command: ["help"]
    profiles: ["cli"]

volumes:
  kafka-data:
