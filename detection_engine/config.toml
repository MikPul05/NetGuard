[rules.port_scan]               
enabled = true
window_seconds = 10
min_unique_dst_ports = 20

[rules.brute_force]             
enabled = true
window_seconds = 60             
ports = [21, 22, 23, 3389]      
min_attempts = 10

[rules.dos]                     
enabled = true
window_seconds = 10
min_attempts_to_destination = 100
max_unique_dst_ports = 5       



[statistical]
enabled = true
window_seconds = 10
baseline_seconds = 30           
z_threshold = 3.0               
min_std = 1.0                   
features = [                    
    "connection_attempts",
    "unique_dst_ports",
    "unique_dst_ips",
    "byte_count",
]

[evaluation]
window_seconds = 10             